[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["repo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["addons", "tools", "tests"]
extraPaths = ["addons/plugin.program.artlibcleanup", "tools"]
pythonVersion = "3.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["addons/plugin.program.artlibcleanup", "tools"]

[tool.coverage.run]
include = ["addons/**/*.py", "tools/**/*.py"]
omit = ["repo/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
